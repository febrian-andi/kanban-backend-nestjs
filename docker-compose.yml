services:
  kanban_be_service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kanban_be_nestjs
    restart: on-failure
    ports:
      - '${PORT}:${PORT}'
    env_file:
      - .env
    links:
      - kanban_be_postgres

  kanban_be_postgres:
    image: postgres:15
    container_name: kanban_be_nestjs_postgres
    restart: on-failure
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - '${DB_PORT}:${DB_PORT}'
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
